name: CAD and browser checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up cached runtime builder
        uses: docker/setup-buildx-action@v4
      - name: Build pinned local runtime
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: oxygen-cad:latest
          cache-from: type=gha,scope=oxygen-cad-runtime
          cache-to: type=gha,scope=oxygen-cad-runtime,mode=max
      - name: Geometry, editing and numerical tests
        run: |
          docker run --rm \
            -e O3D_CURA_ENGINE=/usr/bin/CuraEngine \
            -e O3D_CAM_PYTHON=/usr/bin/python3 \
            oxygen-cad sh -eu -c '
            python -m pip install --no-cache-dir -r tests/requirements-verification.lock
            python -c "import pypdf, gerbonara"
            pytest -q -ra
          '
      - name: Independent quadratic finite-element comparison
        run: >-
          docker run --rm oxygen-cad sh -c
          'python -m pip install --no-deps --require-hashes -r verification-requirements.lock &&
          O3D_REFERENCE_PYTHON=/opt/cad/bin/python pytest -q tests/test_reference_solver.py tests/test_canonical_thermal_reference.py tests/test_thermoelastic_reference.py tests/test_canonical_modal_reference.py tests/test_canonical_buckling_reference.py tests/test_canonical_bonded_reference.py tests/test_contact_global.py'
      - name: Package the local desktop runtime
        run: |
          docker tag oxygen-cad oxygen-cad:desktop-runtime
          mkdir -p desktop-runtime
          docker image inspect oxygen-cad --format '{{.Id}}' > desktop-runtime/image-id.txt
          docker save oxygen-cad:desktop-runtime | gzip -1 > desktop-runtime/runtime.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-runtime
          path: desktop-runtime/
          compression-level: 0
  browser:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: desktop-runtime
          path: desktop-runtime
      - name: Load the verified runtime
        run: |
          gzip -dc desktop-runtime/runtime.tar.gz | docker load
          docker tag oxygen-cad:desktop-runtime oxygen-cad:latest
          test "$(docker image inspect oxygen-cad --format '{{.Id}}')" = "$(cat desktop-runtime/image-id.txt)"
      - name: Install browser verification tools
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
      - name: Browser acceptance with a fresh runtime per spec
        run: python3 scripts/run_browser_checks.py --mode docker --image oxygen-cad
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: frontend/test-results/
  desktop-macos:
    needs: verify
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal
      - uses: actions/download-artifact@v4
        with:
          name: desktop-runtime
          path: desktop-runtime
      - name: Build Apple Silicon desktop app
        env:
          RUSTUP_TOOLCHAIN: 1.95.0
          O3D_DESKTOP_RUNTIME_ARCHIVE: ${{ github.workspace }}/desktop-runtime/runtime.tar.gz
        run: |
          test "$(uname -m)" = arm64
          O3D_DESKTOP_RUNTIME_IMAGE="$(cat desktop-runtime/image-id.txt)"
          export O3D_DESKTOP_RUNTIME_IMAGE
          npm ci --prefix desktop
          cd desktop
          npm run build -- --target aarch64-apple-darwin --bundles app
      - name: Ad-hoc sign and archive test app
        run: |
          APP="desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Oxygen CAD.app"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          mkdir -p desktop-download
          ditto -c -k --sequesterRsrc --keepParent "$APP" desktop-download/Oxygen-CAD-Apple-Silicon.zip
          shasum -a 256 desktop-download/Oxygen-CAD-Apple-Silicon.zip > desktop-download/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Oxygen-CAD-Apple-Silicon
          path: desktop-download/
          compression-level: 0
  publish-preview:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [browser, desktop-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Oxygen-CAD-Apple-Silicon
          path: preview-download
      - name: Prepare public preview receipt
        run: |
          cd preview-download
          sha256sum Oxygen-CAD-Apple-Silicon.zip > SHA256SUMS.txt
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          sha = os.environ['GITHUB_SHA']
          run = os.environ['GITHUB_RUN_ID']
          Path('source.json').write_text(json.dumps({'commit': sha, 'run_id': run, 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'platform': 'macOS Apple Silicon', 'runtime': 'local Docker Desktop; not a standalone native solver'}, indent=2) + '\n')
          Path('release-notes.md').write_text(f'''Apple Silicon desktop test preview from `{sha}`.

          Download **Oxygen-CAD-Apple-Silicon.zip** below, unzip once and move **Oxygen CAD.app** to Applications. Projects remain in the app's Application Support folder.

          **Docker Desktop is required for this preview.** The app is ad-hoc signed, not notarized; macOS may require Privacy & Security → Open Anyway on first launch. A fully native standalone runtime remains separate work.

          This source passed its CAD/numerical checks and browser acceptance; macOS packaging passed. Automated checks do not establish full Fusion parity or physical Mac task acceptance.

          Source and build receipt: source.json. Verify the archive with SHA256SUMS.txt.
          ''')
          PY
      - name: Publish versioned Mac preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "preview-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Mac editing preview ${GITHUB_SHA::7}" --prerelease --latest=false \
            --notes-file preview-download/release-notes.md \
            preview-download/Oxygen-CAD-Apple-Silicon.zip \
            preview-download/SHA256SUMS.txt preview-download/source.json
