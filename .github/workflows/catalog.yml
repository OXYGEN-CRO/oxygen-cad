name: Parts catalog checks
on:
  push:
    paths: ['src/o3d/catalog/**', 'tests/catalog/**', 'catalog*', 'pyproject.toml', '.github/workflows/catalog.yml']
  pull_request:
    paths: ['src/o3d/catalog/**', 'tests/catalog/**', 'catalog*', 'pyproject.toml', '.github/workflows/catalog.yml']
jobs:
  catalog:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: oxygen_parts_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only
        ports: ['5432:5432']
        options: --health-cmd 'pg_isready -U postgres' --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r catalog-requirements.lock
      - run: python -m pytest -q tests/catalog
        env:
          PYTHONPATH: src
          O3D_CATALOG_TEST_DATABASE_URL: postgresql://postgres:test-only@127.0.0.1:5432/oxygen_parts_test
