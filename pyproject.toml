[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "oxygen-cad"
version = "0.1.0"
description = "Local, agent-driven parametric CAD and verification studio"
requires-python = ">=3.12"
dependencies = ["build123d==0.13.0", "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic>=2.10,<3", "typer>=0.15,<1", "numpy>=2,<3", "scipy>=1.15,<2", "shapely>=2.1,<3", "ezdxf>=1.4,<2", "networkx>=3.4,<4", "pillow>=11,<13", "python-multipart>=0.0.20,<1", "trimesh>=4.6,<5"]

[project.optional-dependencies]
skills = ["reportlab>=4.4,<5"]
test = ["pytest>=8,<10", "httpx>=0.28,<1"]
catalog = ["psycopg[binary]>=3.2,<4", "httpx>=0.28,<1"]
catalog-semantic = ["psycopg[binary]>=3.2,<4", "httpx>=0.28,<1", "fastembed>=0.7,<1"]

[project.scripts]
o3d = "o3d.cli:app"
o3d-parts = "o3d.catalog.cli:main"

[tool.setuptools.package-data]
"o3d.catalog" = ["schema.sql"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
